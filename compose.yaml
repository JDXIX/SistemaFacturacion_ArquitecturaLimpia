# Opcional: Docker se utiliza SOLO para iniciar RabbitMQ en desarrollo local.
services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_local:/var/lib/rabbitmq

volumes:
  rabbitmq_local:
